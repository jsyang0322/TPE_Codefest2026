<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>讓家人幫忙</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/care.css">
</head>
<body class="care-elder">
  <!-- 代操作中固定在上方的橫幅（規格第一部分第 4.3 節） -->
  <div id="banner" class="banner" hidden>
    <p id="banner-text" class="banner-text"></p>
    <div class="banner-actions">
      <button class="btn btn-danger" type="button" data-action="revoke">終止授權</button>
      <button class="btn btn-secondary" type="button" data-action="takeover">我自己來</button>
    </div>
  </div>

  <main id="main" class="page care">
    <header class="care-header">
      <h1 id="page-title" tabindex="-1">讓家人幫忙</h1>
      <p class="muted">登入身分：<span id="me"></span><button class="link-btn" type="button" data-action="logout">登出</button></p>
      <p id="conn" class="note" hidden>連線中斷，正在重新連線…</p>
    </header>

    <section id="view-home" aria-labelledby="page-title">
      <p>家人可以用他的手機幫你操作台北通。付款這類重要的事，一定會先問你；你也隨時可以停止授權。</p>
      <button class="btn btn-primary" type="button" data-action="invite">讓家人幫我操作</button>
      <h2>可以幫你操作的家人</h2>
      <p id="links-empty" class="muted">目前沒有。</p>
      <ul id="links-list" class="link-list"></ul>
    </section>

    <section id="view-code" hidden aria-labelledby="code-title">
      <h2 id="code-title" tabindex="-1">把這組數字告訴家人</h2>
      <p id="code-digits" class="code"></p>
      <div id="code-qr" class="qr" role="img" aria-label="QR code，家人可以用台北通掃描"></div>
      <p id="code-countdown" class="muted"></p>
      <p class="muted">家人輸入數字或掃描 QR code 後，會再問你是否同意。</p>
      <button class="btn btn-primary" type="button" data-action="repeat-code">再說一次數字</button>
      <button class="btn btn-secondary" type="button" data-action="cancel-code">取消</button>
    </section>

    <section id="view-observe" hidden aria-labelledby="observe-title">
      <h2 id="observe-title" tabindex="-1"></h2>
      <p id="observe-step" class="step-now"></p>
      <div id="observe-form" class="card"></div>
      <p id="observe-result" class="result" hidden></p>
    </section>
  </main>

  <!-- 對話框：同意授權 -->
  <div id="dlg-link" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-link-title" aria-describedby="dlg-link-desc" hidden>
    <h2 id="dlg-link-title" tabindex="-1"></h2>
    <p id="dlg-link-desc">同意後，他可以幫你操作台北通。付款等重要操作，還是會先問你。</p>
    <button class="btn btn-primary" type="button" data-action="link-accept">同意</button>
    <button class="btn btn-secondary" type="button" data-action="link-reject">不同意</button>
  </div>

  <!-- 對話框：同意請求（付款等） -->
  <div id="dlg-consent" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-consent-title" aria-describedby="dlg-consent-summary" hidden>
    <h2 id="dlg-consent-title" tabindex="-1">請你確認</h2>
    <p id="dlg-consent-summary" class="summary"></p>
    <div id="dlg-consent-code" class="voice-code">
      <span>確認數字</span>
      <strong id="dlg-consent-code-value"></strong>
      <span class="small">用說的同意時，請說「同意」再說這個數字</span>
    </div>
    <p id="dlg-consent-countdown" class="muted"></p>
    <p id="dlg-consent-status" class="status-box"></p>
    <button id="btn-consent-accept" class="btn btn-primary" type="button" data-action="consent-accept"></button>
    <button class="btn btn-secondary" type="button" data-action="consent-reject">不同意</button>
  </div>

  <!-- 對話框：終止授權確認 -->
  <div id="dlg-revoke" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-revoke-title" hidden>
    <h2 id="dlg-revoke-title" tabindex="-1"></h2>
    <button class="btn btn-danger" type="button" data-action="revoke-confirm">確定停止</button>
    <button class="btn btn-secondary" type="button" data-action="revoke-cancel">取消</button>
  </div>

  <!-- 下方說話區：說「讓家人幫我」「停止授權」「我自己來」「同意」等 -->
  <div class="talk-area">
    <form id="mock-mic" class="mock-mic" hidden>
      <label for="mock-input">（電腦測試）用打字代替說話</label>
      <div class="ask-row">
        <input id="mock-input" type="text" autocomplete="off">
        <button class="btn btn-primary" type="submit">說完了</button>
        <button id="mock-cancel" class="btn btn-secondary" type="button">不說了</button>
      </div>
    </form>
    <button id="btn-talk" class="talk-btn" type="button">
      <svg class="talk-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z" fill="currentColor"/>
      </svg>
      <span id="talk-label">按這裡說話</span>
      <span id="talk-partial" class="talk-partial"></span>
    </button>
  </div>

  <div id="announce-polite" class="visually-hidden" aria-live="polite"></div>
  <div id="announce-assertive" class="visually-hidden" aria-live="assertive"></div>

  <script type="module" src="js/elder-page.js"></script>
</body>
</html>
