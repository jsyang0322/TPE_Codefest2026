<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>模擬服務：市民服務申辦</title>
  <link rel="icon" href="data:,">
  <style>
    /* 電腦測試「分享畫面」用的模擬服務頁，不是真的台北通服務。在台北通裡請改開真的服務網頁。 */
    :root { --ink: #1f2b2e; --muted: #5b6a6e; --line: #cfd9db; --brand: #2f6a75; --bg: #f3f6f6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
    header { background: var(--brand); color: #fff; padding: 14px 16px; }
    header p { margin: 0; font-size: 14px; opacity: .9; }
    header h1 { margin: 2px 0 0; font-size: 22px; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
    .back { color: var(--brand); font-weight: 700; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: 700; }
    input, select, textarea { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
    button { font: inherit; font-weight: 700; min-height: 48px; border-radius: 10px; border: 2px solid var(--brand); cursor: pointer; }
    .primary { background: var(--brand); color: #fff; }
    .secondary { background: #fff; color: var(--brand); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 700; }
    .done { background: #e6f4ea; border-color: #9bd3ab; }
    .note { color: var(--muted); font-size: 14px; margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <p>模擬服務（測試用，不是真的台北通服務）</p>
    <h1>市民服務申辦</h1>
  </header>
  <main>
    <a id="back-link" class="back" href="../elder.html" hidden>← 回到「讓家人幫忙」</a>

    <section id="step-1" class="card" aria-labelledby="step-1-title">
      <h2 id="step-1-title">1. 填寫資料</h2>
      <label for="name">姓名</label>
      <input id="name" autocomplete="off" placeholder="例如 王大明">
      <label for="phone">手機號碼</label>
      <input id="phone" inputmode="tel" autocomplete="off" placeholder="例如 0912345678">
      <label for="item">申辦項目</label>
      <select id="item">
        <option value="">請選擇</option>
        <option value="敬老愛心卡">敬老愛心卡</option>
        <option value="身心障礙停車證">身心障礙停車證</option>
        <option value="房屋稅減免">房屋稅減免</option>
      </select>
      <label for="password">密碼（測試：家人不能幫忙填）</label>
      <input id="password" type="password" autocomplete="off">
      <button id="next" class="primary" type="button">下一步</button>
    </section>

    <section id="step-2" class="card" aria-labelledby="step-2-title" hidden>
      <h2 id="step-2-title">2. 確認資料</h2>
      <dl>
        <dt>姓名</dt><dd id="sum-name"></dd>
        <dt>手機</dt><dd id="sum-phone"></dd>
        <dt>項目</dt><dd id="sum-item"></dd>
      </dl>
      <div class="row">
        <button id="prev" class="secondary" type="button">上一步</button>
        <button id="submit" class="primary" type="button">送出申請</button>
      </div>
    </section>

    <section id="done" class="card done" hidden>
      <h2>已送出申請（模擬）</h2>
      <p>案件編號 <strong id="case-no"></strong>，不會真的送出。</p>
    </section>

    <p class="note">這一頁用來在電腦上測試「讓家人幫忙」的分享畫面。在台北通裡，分享程式會放進真的服務網頁。</p>
  </main>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      $('next').addEventListener('click', function () {
        $('sum-name').textContent = $('name').value || '（未填）';
        $('sum-phone').textContent = $('phone').value || '（未填）';
        $('sum-item').textContent = $('item').value || '（未選）';
        $('step-1').hidden = true;
        $('step-2').hidden = false;
      });
      $('prev').addEventListener('click', function () {
        $('step-2').hidden = true;
        $('step-1').hidden = false;
      });
      $('submit').addEventListener('click', function () {
        $('case-no').textContent = 'T' + Date.now().toString().slice(-6);
        $('step-2').hidden = true;
        $('done').hidden = false;
      });

      // 電腦測試：沒有台北通 App，自己載入分享程式（設定由「讓家人幫忙」頁存在 sessionStorage）
      if (window.flutterObject) return;
      $('back-link').hidden = false;
      try {
        window.__A11Y_SHARE__ = JSON.parse(sessionStorage.getItem('a11y.share') || 'null');
      } catch (e) {
        window.__A11Y_SHARE__ = null;
      }
      if (!window.__A11Y_SHARE__) return;
      var lib = document.createElement('script');
      lib.src = '../vendor/rrweb/record.min.js';
      lib.onload = function () {
        var agent = document.createElement('script');
        agent.src = '../js/share-agent.js';
        document.body.appendChild(agent);
      };
      document.body.appendChild(lib);
    })();
  </script>
</body>
</html>
