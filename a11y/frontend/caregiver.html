<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>幫家人操作</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/care.css">
  <link rel="stylesheet" href="vendor/rrweb/replay.min.css">
</head>
<body class="care-caregiver">
  <main id="main" class="page care">
    <header class="care-header">
      <h1 id="page-title" tabindex="-1">幫家人操作</h1>
      <p class="muted">登入身分：<span id="me"></span><button class="link-btn" type="button" data-action="logout">登出</button></p>
      <p id="conn" class="note" hidden>連線中斷，正在重新連線…</p>
    </header>

    <!-- 訊息（同時是 live region，螢幕閱讀器會念） -->
    <p id="status" class="status-box" role="status"></p>

    <section id="view-home" aria-labelledby="page-title">
      <form id="code-form" class="code-form">
        <label for="code-input">輸入家人手機上的 6 位數字</label>
        <div class="ask-row">
          <input id="code-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" placeholder="例如 482715">
          <button class="btn btn-primary" type="submit">送出</button>
        </div>
      </form>
      <button id="btn-scan" class="btn btn-secondary" type="button" data-action="scan" hidden>用台北通掃描 QR code</button>

      <h2>我協助的人</h2>
      <p id="links-empty" class="muted">目前沒有。</p>
      <ul id="links-list" class="link-list"></ul>
    </section>

    <section id="view-watch" hidden aria-labelledby="watch-title">
      <h2 id="watch-title" tabindex="-1"></h2>
      <p id="watch-page" class="watch-page"></p>
      <div class="watch-controls" role="group" aria-label="操作對方的畫面">
        <button class="btn btn-secondary" type="button" data-action="scroll-up">往上</button>
        <button class="btn btn-secondary" type="button" data-action="scroll-down">往下</button>
        <button class="btn btn-secondary" type="button" data-action="go-back">上一頁</button>
      </div>
      <div id="stage" class="stage">
        <p id="stage-empty" class="stage-empty"></p>
        <div id="replay" class="replay" hidden></div>
      </div>
      <p id="watch-hint" class="muted"></p>
      <button class="btn btn-secondary" type="button" data-action="leave">回到首頁</button>
    </section>
  </main>

  <!-- 對話框：幫忙填寫 -->
  <div id="dlg-input" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-input-title" hidden>
    <h2 id="dlg-input-title" tabindex="-1"></h2>
    <form id="input-form" class="input-form">
      <label id="input-text-label" for="input-text">要填的內容</label>
      <textarea id="input-text" rows="2" maxlength="500" autocomplete="off"></textarea>
      <label id="input-select-label" for="input-select" hidden>選擇</label>
      <select id="input-select" hidden></select>
      <button class="btn btn-primary" type="submit">填入</button>
      <button class="btn btn-secondary" type="button" data-action="input-cancel">取消</button>
    </form>
  </div>

  <div id="announce-polite" class="visually-hidden" aria-live="polite"></div>
  <div id="announce-assertive" class="visually-hidden" aria-live="assertive"></div>

  <!-- rrweb（MIT）：重播對方畫面。放在 module 之前，會建立全域的 rrwebReplay -->
  <script src="vendor/rrweb/replay.min.js"></script>
  <script type="module" src="js/caregiver-page.js"></script>
</body>
</html>
