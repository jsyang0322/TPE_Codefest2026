<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>幫家人操作</title>
  <link rel="icon" href="data:,">
  <!-- 在台北通 App 裡（App 一開始就放了 flutterObject）：不顯示網頁自己的標題列，用 App 的 -->
  <script>if (window.flutterObject) document.documentElement.classList.add('in-app');</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/care.css">
  <link rel="stylesheet" href="vendor/rrweb/replay.min.css">
</head>
<body class="care-caregiver">
  <header class="tp-appbar">
    <h1 id="page-title" tabindex="-1">幫家人操作</h1>
  </header>

  <main id="main" class="page care">
    <div class="card who">
      <span id="me-avatar" class="avatar teal" aria-hidden="true"></span>
      <p class="who-name"><span class="muted small">登入身分</span><strong id="me"></strong></p>
      <button class="link-btn" type="button" data-action="logout">登出</button>
    </div>
    <p id="conn" class="note" hidden>連線中斷，正在重新連線…</p>

    <!-- 訊息（同時是 live region，螢幕閱讀器會念）。捲動時固定在上方，一直看得到 -->
    <p id="status" class="status-box" role="status"></p>

    <section id="view-home" aria-labelledby="page-title">
      <form id="code-form" class="card code-form">
        <label for="code-input">輸入家人手機上的 6 位數字</label>
        <p class="muted small">請家人打開台北通的「無障礙輔助」，按「讓家人幫我」，再把手機上的數字告訴你。</p>
        <input id="code-input" class="code-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" placeholder="000000">
        <button class="btn btn-primary" type="submit">送出</button>
      </form>

      <h2 class="section-title">我協助的人</h2>
      <p id="links-empty" class="card muted">目前沒有。輸入家人給你的數字，他同意後就會出現在這裡。</p>
      <ul id="links-list" class="link-list"></ul>
    </section>

    <section id="view-watch" hidden aria-labelledby="watch-title">
      <div class="watch-head">
        <div>
          <h2 id="watch-title" tabindex="-1"></h2>
          <p id="watch-page" class="watch-page"></p>
        </div>
        <button class="btn btn-secondary btn-small" type="button" data-action="leave">不看了</button>
      </div>
      <!--
        框框 = 對方的手機：畫面、打字框、手機下方的按鈕列都在框框裡。捲動直接在畫面上拖曳或滾動滾輪。
        看畫面時整個螢幕給框框用（頁面不捲動），對方的畫面等比例縮到 stage-view 裡一次看得完（caregiver-page.js 的 fitScreen）
      -->
      <div id="stage" class="stage">
       <div id="stage-view" class="stage-view">
        <p id="stage-empty" class="stage-empty"></p>
        <!-- 台北通 App 拍下的整個畫面：網頁的部分是另外拍的截圖，疊在上面 -->
        <div id="screen" class="screen" hidden>
          <img id="screen-base" alt="" draggable="false">
          <div id="screen-overlays"></div>
          <span id="screen-tap" class="screen-tap" hidden></span>
        </div>
        <!-- 電腦測試的模擬服務頁：rrweb 重播網頁 -->
        <div id="replay" class="replay" hidden></div>
       </div>
        <!-- 打字框：點到對方畫面上的欄位時，像手機鍵盤一樣出現在框框下方 -->
        <div id="dlg-input" class="type-panel" role="group" aria-labelledby="dlg-input-title" hidden>
          <h2 id="dlg-input-title" tabindex="-1"></h2>
          <form id="input-form" class="input-form">
            <label id="input-text-label" for="input-text">要填的內容</label>
            <textarea id="input-text" rows="2" maxlength="500" autocomplete="off"></textarea>
            <label id="input-select-label" for="input-select" hidden>選擇</label>
            <select id="input-select" hidden></select>
            <div class="type-actions">
              <button class="btn btn-primary" type="submit">填入</button>
              <button class="btn btn-secondary" type="button" data-action="input-cancel">取消</button>
            </div>
          </form>
        </div>
        <!-- 手機下方的按鈕列 -->
        <div id="phone-bar" class="phone-bar" role="group" aria-label="操作對方的手機" hidden>
          <button class="phone-btn" type="button" data-action="go-back">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>上一頁</span>
          </button>
          <button id="btn-home" class="phone-btn" type="button" data-action="go-home" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
            <span>首頁</span>
          </button>
          <button id="btn-type" class="phone-btn" type="button" data-action="type-text" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10h1m3 0h1m3 0h1m3 0h1M7 14h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>打字</span>
          </button>
        </div>
      </div>
      <p id="watch-hint" class="muted small watch-hint"></p>
    </section>
  </main>

  <div id="announce-polite" class="visually-hidden" aria-live="polite"></div>
  <div id="announce-assertive" class="visually-hidden" aria-live="assertive"></div>

  <!-- rrweb（MIT）：重播對方畫面。放在 module 之前，會建立全域的 rrwebReplay -->
  <script src="vendor/rrweb/replay.min.js"></script>
  <script type="module" src="js/caregiver-page.js"></script>
</body>
</html>
